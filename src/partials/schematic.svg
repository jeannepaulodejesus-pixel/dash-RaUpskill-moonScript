<svg class="schematic" viewBox="0 0 640 400" role="img" aria-labelledby="schem-t schem-d">
        <title id="schem-t">Schematic of the Apps Script editor</title>
        <desc id="schem-d">Four regions: 1 the Code.gs file and its code, 2 the Run button beside the function picker, 3 the execution log below the code, 4 the authorization dialog that appears on first run.</desc>
        <g fill="none" stroke="currentColor" stroke-width="1.2">
          <rect x="8" y="8" width="624" height="384" rx="10"/>
          <line x1="8" y1="48" x2="632" y2="48"/>
          <line x1="140" y1="48" x2="140" y2="392"/>
          <line x1="140" y1="268" x2="632" y2="268"/>
          <rect x="332" y="18" width="150" height="20" rx="4"/>
          <rect x="490" y="18" width="52" height="20" rx="4" class="schematic__hot"/>
          <rect x="22" y="64" width="104" height="22" rx="4" class="schematic__hot"/>
        </g>
        <g fill="currentColor" font-family="var(--sc-font-mono)" font-size="11">
          <text x="30" y="79">Code.gs</text>
          <text x="340" y="32">buildActiveRoster</text>
          <text x="500" y="32">Run</text>
          <text x="156" y="288" opacity=".75">Execution log</text>
          <text x="156" y="310" opacity=".6">Notice  Execution started</text>
          <text x="156" y="328" opacity=".6">Info    Wrote 6 active employees</text>
          <text x="156" y="346" opacity=".6">Notice  Execution completed</text>
        </g>
        <g stroke="currentColor" opacity=".35" stroke-width="6" stroke-linecap="round">
          <line x1="160" y1="72" x2="330" y2="72"/><line x1="176" y1="92" x2="420" y2="92"/>
          <line x1="176" y1="112" x2="470" y2="112"/><line x1="176" y1="132" x2="450" y2="132"/>
          <line x1="176" y1="160" x2="330" y2="160"/><line x1="176" y1="180" x2="400" y2="180"/>
          <line x1="192" y1="200" x2="430" y2="200"/><line x1="208" y1="220" x2="380" y2="220"/>
        </g>
        <g class="schematic__dialog">
          <rect x="420" y="120" width="196" height="118" rx="8" fill="var(--paper)" stroke="currentColor" stroke-width="1.2"/>
          <text x="434" y="146" font-size="12" font-weight="600" fill="currentColor">Authorization required</text>
          <text x="434" y="166" font-size="10.5" fill="currentColor" opacity=".7">This script needs your</text>
          <text x="434" y="181" font-size="10.5" fill="currentColor" opacity=".7">permission to access</text>
          <text x="434" y="196" font-size="10.5" fill="currentColor" opacity=".7">your spreadsheets.</text>
          <rect x="530" y="208" width="74" height="20" rx="4" fill="none" stroke="currentColor"/>
          <text x="540" y="222" font-size="10.5" fill="currentColor">Review</text>
        </g>
        <g class="schematic__pins" font-size="12" font-weight="700">
          <circle cx="132" cy="64" r="11"/><text x="128" y="68">1</text>
          <circle cx="552" cy="16" r="11"/><text x="548" y="20">2</text>
          <circle cx="148" cy="268" r="11"/><text x="144" y="272">3</text>
          <circle cx="616" cy="122" r="11"/><text x="612" y="126">4</text>
        </g>
      </svg>
