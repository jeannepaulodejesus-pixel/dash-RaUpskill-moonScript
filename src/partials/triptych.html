<header class="lesson__head">
      <p class="lesson__kicker" data-ms-kicker></p>
      <h2 class="lesson__title" data-ms-title></h2>
    </header>
    <div class="tri" data-ms-tri>
      <section class="lane lane--sop glass" aria-label="Instruction">
        <h3 class="lane__label">Instruction</h3>
        <ol class="sop" data-ms-sop></ol>
      </section>
      <section class="lane lane--code glass glass--smoke" aria-label="Code">
        <h3 class="lane__label">Code <span class="lane__note" data-ms-code-note></span></h3>
        <div class="code-window" data-ms-code-window><pre class="code" data-ms-code></pre></div>
      </section>
      <section class="lane lane--cons glass" aria-label="Consequence">
        <h3 class="lane__label">Consequence</h3>
        <div class="cons" data-ms-cons></div>
      </section>
      <svg class="bridge" data-ms-bridge aria-hidden="true" focusable="false"></svg>
    </div>
    <footer class="lesson__foot glass">
      <p class="lesson__say" data-ms-say aria-live="polite"></p>
      <div class="stepper">
        <button class="btn btn--ghost btn--sm" type="button" data-ms-prev aria-label="Previous step">Previous</button>
        <span class="stepper__count" data-ms-count></span>
        <button class="btn btn--sm" type="button" data-ms-next aria-label="Next step">Next</button>
      </div>
    </footer>
